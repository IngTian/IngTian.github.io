<!doctype html><html><head><meta charset=utf-8><title>rails</title><style>
:root{--paper:#efe9dd;--ochre:#c8a36a;--indigo:#6d7689}
body{margin:0;background:#2a2720;color:var(--paper);font-family:Georgia,serif}
.spacer{height:100vh;display:grid;place-items:center;font-family:ui-monospace,monospace;font-size:12px;opacity:.4}
.desk{padding:6vh 6vw}
.stage{perspective:1500px;perspective-origin:50% 38%}
/* THE CAMERA ON RAILS: scene tilt driven by scroll position, zero JS. */
.scene{transform-style:preserve-3d;position:relative;height:600px;
       transform:rotateX(4deg)}                     /* finished static state */
@media (prefers-reduced-motion:no-preference){
  .scene{animation:camera linear both;animation-timeline:view();animation-range:entry 10% exit 90%}
  @keyframes camera{
    from{transform:rotateX(13deg) translateZ(-160px)}
    50% {transform:rotateX(4deg)  translateZ(0)}
    to  {transform:rotateX(-6deg) translateZ(60px)}
  }
}
.card{position:absolute;width:250px}
.bb{transform-style:preserve-3d}
.face{padding:13px 15px;background:#413e37;border:1px solid rgba(239,233,221,.16);border-radius:6px}
h4{margin:0 0 3px;font-size:15px}
p{margin:0;font-size:11.5px;line-height:1.55;opacity:.72;font-family:system-ui}
.tag{font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ochre)}
.c1{left:2%;top:30px}   .c1 .bb{transform:translateZ(-200px)}
.c2{left:26%;top:0}     .c2 .bb{transform:translateZ(-90px)}
.c3{left:50%;top:30px}  .c3 .bb{transform:translateZ(-200px)}
.c4{left:74%;top:0}     .c4 .bb{transform:translateZ(-90px)}
.c5{left:14%;top:200px} .c5 .bb{transform:translateZ(-140px)}
.c6{left:44%;top:230px;width:340px} .c6 .bb{transform:translateZ(30px)}
.support{font-family:ui-monospace,monospace;font-size:12px;padding:20px 6vw;color:var(--ochre)}
</style></head><body>
<div class=spacer>scroll down</div>
<div class=desk><div class=stage><div class=scene>
 <div class="card c1"><div class=bb><div class=face><div class=tag>Go &middot; MCP</div><h4>witness</h4><p>Person-centric archive.</p></div></div></div>
 <div class="card c2"><div class=bb><div class=face><div class=tag>Swift</div><h4>manifold</h4><p>Terrain as a screen saver.</p></div></div></div>
 <div class="card c3"><div class=bb><div class=face><div class=tag>q-fin.PM</div><h4>RL-BHRP</h4><p>Sharpe 0.90.</p></div></div></div>
 <div class="card c4"><div class=bb><div class=face><div class=tag>Go &middot; Kafka</div><h4>Dual-tower</h4><p>Retrieval and ranking.</p></div></div></div>
 <div class="card c5"><div class=bb><div class=face><div class=tag>2021</div><h4>IEEExtreme</h4><p>Top 4 in Canada.</p></div></div></div>
 <div class="card c6"><div class=bb><div class=face><div class=tag>ask-me</div><h4>ingtian@research</h4><p>&gt; Type / to ask a question&hellip;</p></div></div></div>
</div></div></div>
<div class=support id=probe></div>
<div class=spacer>keep scrolling</div>
<script>
const s = document.getElementById('probe');
const supports = [
 ['animation-timeline: view()', CSS.supports('animation-timeline','view()')],
 ['animation-range', CSS.supports('animation-range','entry 10% exit 90%')],
 ['transform-style: preserve-3d', CSS.supports('transform-style','preserve-3d')],
 ['perspective', CSS.supports('perspective','1500px')],
 ['ViewTimeline API', typeof ViewTimeline !== 'undefined'],
];
s.textContent = supports.map(([k,v])=>k+' = '+v).join('  |  ');
</script>
</body></html>
