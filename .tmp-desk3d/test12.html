<!doctype html><html><head><meta charset=utf-8><style>
@property --rx{syntax:'<angle>';inherits:false;initial-value:0deg}
:root{--paper:#efe9dd;--ochre:#c8a36a}
body{margin:0;background:#2a2720;color:var(--paper);font-family:ui-monospace,monospace;font-size:13px;padding:20px}
.stage{perspective:1500px;height:300px}
.scene{transform-style:preserve-3d;position:relative;height:280px}
.card{position:absolute;width:200px;padding:10px;background:#413e37;border:1px solid #5558}
/* A: transform animated DIRECTLY (compositable) */
#a .scene{animation:direct 3s linear infinite;will-change:transform}
@keyframes direct{from{transform:rotateX(0deg)}to{transform:rotateX(20deg)}}
/* B: transform reads a registered custom property that is animated */
#b .scene{transform:rotateX(var(--rx));animation:viavar 3s linear infinite;will-change:transform}
@keyframes viavar{from{--rx:0deg}to{--rx:20deg}}
#out{white-space:pre;color:var(--ochre);margin-top:16px}
</style></head><body>
<div id=a class=stage><div class=scene><div class=card>A: direct transform keyframes</div></div></div>
<div id=b class=stage><div class=scene><div class=card>B: transform:rotateX(var(--rx)), --rx animated</div></div></div>
<div id=out></div>
<script>
const res=[];
for(const sel of ['#a .scene','#b .scene']){
  const el=document.querySelector(sel);
  const anims=el.getAnimations();
  const info=anims.map(a=>{
    // Chrome exposes whether an animation was accepted by the compositor
    let reasons='n/a';
    try{ reasons = a.animationName || a.constructor.name; }catch(e){}
    return {name:a.animationName||'?', playState:a.playState};
  });
  res.push(sel+' -> '+JSON.stringify(info));
}
document.getElementById('out').textContent=res.join('\n');
</script>
</body></html>
