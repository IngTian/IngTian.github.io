<!doctype html><html><head><meta charset=utf-8><style>
:root{--paper:#efe9dd;--ochre:#c8a36a}
html{overflow-x:hidden}
body{margin:0;background:#16140f;color:var(--paper);font-family:Georgia,serif}
/* mimic the real site: .descent is a z-index:0 stacking context with a
   position:fixed negative-z canvas child, plus ::after at z-index:-1 */
.descent{position:relative;z-index:0;background:linear-gradient(180deg,#7d7e88,#3a3833 45%,#16140f);min-height:3200px}
.descent::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;mix-blend-mode:screen;
  background:radial-gradient(90% 22% at 54% 68%,rgba(156,164,186,.34),transparent 80%)}
canvas.sky{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;display:block}
section{padding:12vh 7vw;position:relative}
/* THE DESK SECTION carries perspective */
#desk{perspective:1500px;perspective-origin:50% 38%}
.scene{transform-style:preserve-3d;position:relative;height:520px;transform:rotateX(7deg)}
.card{position:absolute;width:240px}
.bb{transform-style:preserve-3d}
.face{padding:12px 14px;background:rgba(40,36,30,.8);border:1px solid rgba(200,163,106,.2);border-radius:6px}
h4{margin:0 0 3px;font-size:15px}
#probe{position:fixed;left:8px;bottom:8px;font-family:ui-monospace,monospace;font-size:11px;color:var(--ochre);background:#000c;padding:8px 10px;white-space:pre;z-index:99}
</style></head><body>
<div class=descent>
  <canvas class=sky id=sky></canvas>
  <section><h2>Heights</h2></section>
  <section id=desk><div class=scene>
    <div class="card" style="left:2%;top:20px"><div class=bb style="transform:translateZ(-180px)"><div class=face><h4>witness</h4></div></div></div>
    <div class="card" style="left:34%;top:0"><div class=bb style="transform:translateZ(-60px)"><div class=face><h4>manifold</h4></div></div></div>
    <div class="card" style="left:66%;top:20px"><div class=bb style="transform:translateZ(-180px)"><div class=face><h4>RL-BHRP</h4></div></div></div>
  </div></section>
  <section><h2>Ground</h2></section>
</div>
<div id=probe></div>
<script>
// paint the "sky" canvas so we can SEE whether it still shows behind the desk
const c=document.getElementById('sky');
function paint(){c.width=innerWidth/2|0;c.height=innerHeight/2|0;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#8a7f6a');g.addColorStop(1,'#241f18');
 x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
 x.strokeStyle='rgba(200,163,106,.55)';x.lineWidth=1;
 for(let i=0;i<40;i++){x.beginPath();x.moveTo(0,i*14);x.lineTo(c.width,i*14+30);x.stroke();}}
paint();
const cs=getComputedStyle(c);
const deskCS=getComputedStyle(document.getElementById('desk'));
// does the canvas still paint (is it still visible / not clipped by perspective)?
const canvasRect=c.getBoundingClientRect();
// sample a pixel where sky should show THROUGH the desk section's gaps
const mid=document.elementFromPoint(innerWidth*0.5, innerHeight*0.5);
document.getElementById('probe').textContent=
 'canvas position: '+cs.position+'  z-index: '+cs.zIndex+'\n'+
 'canvas rect: '+Math.round(canvasRect.width)+'x'+Math.round(canvasRect.height)+' at '+Math.round(canvasRect.top)+'\n'+
 'desk perspective: '+deskCS.perspective+'\n'+
 'elementFromPoint(centre) = <'+(mid?mid.tagName.toLowerCase()+(mid.className?'.'+mid.className:''):'null')+'>\n'+
 'scrollHeight '+document.documentElement.scrollHeight+'  scrollWidth '+document.documentElement.scrollWidth+' vs innerWidth '+innerWidth;
</script>
</body></html>
