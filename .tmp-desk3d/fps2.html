<!doctype html><html><head><meta charset=utf-8><style>
:root{--paper:#efe9dd;--ochre:#c8a36a}
html{overflow-x:hidden}
body{margin:0;background:#16140f;color:var(--paper);font-family:Georgia,serif}
.descent{position:relative;z-index:0;min-height:2600px;background:linear-gradient(180deg,#7d7e88,#3a3833 45%,#16140f)}
canvas.sky{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;display:block}
#desk{perspective:2200px;perspective-origin:50% 30%;padding:10vh 7vw}
.scene{transform-style:preserve-3d;position:relative;height:620px;will-change:transform;
  animation:cam 5s ease-in-out infinite alternate}
@keyframes cam{from{transform:rotateX(6deg) translateZ(-70px)}to{transform:rotateX(0deg) translateZ(30px)}}
.wall{position:absolute;left:0;right:0;top:0;transform:translateZ(-190px);display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.mon{border:1px solid rgba(239,233,221,.14);border-radius:5px;padding:12px;
  box-shadow:0 16px 34px -18px rgba(0,0,0,.55)}
.mon h4{margin:0 0 4px;font-size:14.5px;font-weight:400}
.mon p{margin:0;font-size:11px;line-height:1.55;color:rgba(239,233,221,.6);font-family:system-ui}
/* MODE A (?bd=1): translucent + backdrop-filter — reads the page backdrop */
body.bd .mon{background:rgba(22,20,15,.30);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
/* MODE B (?bd=0): OPAQUE fill, no backdrop read */
body.op .mon{background:#3b3830}
#out{position:fixed;left:8px;bottom:8px;font-family:ui-monospace,monospace;font-size:14px;color:var(--ochre);background:#000d;padding:7px 11px;z-index:9}
</style></head><body>
<div class=descent><canvas class=sky id=sky></canvas>
<div id=desk><div class=scene><div class=wall id=wall></div></div></div></div>
<div id=out>measuring…</div>
<script>
const bd=new URLSearchParams(location.search).get('bd')!=='0';
document.body.className=bd?'bd':'op';
const w=document.getElementById('wall');
for(let i=0;i<8;i++){const d=document.createElement('div');d.className='mon';
 d.innerHTML='<h4>Project '+(i+1)+'</h4><p>A person-centric archive of how you think and grow, mined from sessions.</p>';w.appendChild(d);}
// live-ish sky: repaint the canvas every frame like FluidSky does
const c=document.getElementById('sky'),x=c.getContext('2d');
function sky(t){c.width=innerWidth/2|0;c.height=innerHeight/2|0;
 const g=x.createLinearGradient(0,0,0,c.height);g.addColorStop(0,'#8a7f6a');g.addColorStop(1,'#241f18');
 x.fillStyle=g;x.fillRect(0,0,c.width,c.height);
 x.strokeStyle='rgba(200,163,106,.4)';
 for(let i=0;i<30;i++){x.beginPath();x.moveTo(0,i*18+Math.sin(t/700+i)*8);x.lineTo(c.width,i*18+24);x.stroke();}}
let frames=0,long=0,t0=performance.now(),last=t0;
function tick(now){sky(now);frames++;const dt=now-last;if(dt>32)long++;last=now;
 if(now-t0>5000){const fps=frames/((now-t0)/1000);
  const msg=(bd?'backdrop-filter':'OPAQUE     ')+' | '+fps.toFixed(1)+' fps | frames>32ms: '+long;
  document.getElementById('out').textContent=msg;document.title='R:'+msg;return;}
 requestAnimationFrame(tick);}
requestAnimationFrame(tick);
</script>
</body></html>
