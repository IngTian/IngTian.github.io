<!doctype html><meta charset=utf8>
<title>scrollWidth is not evidence</title>
<style>
  body { margin: 0; }
  #desk { perspective: 1500px; height: 600px; position: relative; }
  #wide { position: absolute; right: 0; top: 100px; width: 420px; height: 200px;
          background: #3f3c35; color: #efe9dd; transform: translateZ(260px); }
  html.guard { overflow-x: hidden; }
</style>
<section id="desk"><div id="wide">near plane at the right edge — is it clipped?</div></section>
<pre id="out"></pre>
<script>
  const de = document.documentElement;
  const w = document.getElementById('wide');
  function probe(label) {
    const r = w.getBoundingClientRect();
    return label + ': scrollWidth=' + de.scrollWidth + ' innerWidth=' + innerWidth +
           ' planeRight=' + r.right.toFixed(1) + ' overflowPx=' + (r.right - innerWidth).toFixed(1);
  }
  const noGuard = probe('WITHOUT html{overflow-x:hidden}');
  de.classList.add('guard');
  const withGuard = probe('WITH    html{overflow-x:hidden}  (this is what global.css:28 ships)');
  document.getElementById('out').textContent = noGuard + '\n' + withGuard +
    '\n\nIf scrollWidth drops to <= innerWidth only in the second line, then\n' +
    '"scrollWidth 1185 vs innerWidth 1200" proves the GUARD is working,\n' +
    'not that the scene fits. The plane is being silently CLIPPED.';
</script>
