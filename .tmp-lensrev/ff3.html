<!doctype html><meta charset=utf8>
<title>fallback + overflow probe</title>
<style>
  html { overflow-x: hidden; }              /* exactly as global.css:28 */
  body { margin: 0; }
  .pad { height: 400px; }

  /* ---- the PROPOSAL's pattern, verbatim, with animation-timeline REMOVED
          (which is exactly what a browser without SDA support does) ---- */
  .scene { transform: rotateX(3.2deg); transform-style: preserve-3d; }
  @media (prefers-reduced-motion: no-preference) {
    .scene { animation: camera linear both; }
  }
  @keyframes camera {
    0%   { transform: rotateX(6deg) translateZ(-70px); }
    50%  { transform: rotateX(0deg); }
    100% { transform: rotateX(-4deg) translateZ(30px); }
  }

  /* ---- overflow probe: a NEAR plane inside a perspective section ---- */
  #desk { perspective: 1500px; height: 1000px; position: relative; }
  #near { position: absolute; left: 40px; top: 60px; width: 500px; height: 700px;
          background: #3f3c35; transform: translateZ(300px); }
  #wide { position: absolute; right: 0; top: 300px; width: 420px; height: 200px;
          background: #555; transform: translateZ(260px); }
</style>
<div class="pad"></div>
<div class="scene">SCENE — should be the finished static state in Firefox</div>
<section id="desk">
  <div id="near">near plane, translateZ(300px)</div>
  <div id="wide">wide near plane at right edge</div>
</section>
<div class="pad"></div>
<pre id="out"></pre>
<script>
  function ang(m) {           // recover rotateX degrees from a matrix3d string
    const n = m.match(/-?[\d.e+-]+/g).map(Number);
    if (n.length !== 16) return 'n/a';
    return (Math.atan2(n[6], n[5]) * 180 / Math.PI).toFixed(3);
  }
  const s = getComputedStyle(document.querySelector('.scene'));
  const de = document.documentElement;
  document.getElementById('out').textContent =
    'computed .scene transform = ' + s.transform + '\n' +
    '  -> recovered rotateX deg = ' + ang(s.transform) + '   (INTENDED static = 3.2)\n' +
    '  -> tz component (m43)    = ' + (s.transform.match(/-?[\d.e+-]+/g)||[]).slice(14,15) + '\n' +
    'animation-name=' + s.animationName + ' duration=' + s.animationDuration + ' fill=' + s.animationFillMode + '\n' +
    '\n--- overflow probe (html{overflow-x:hidden}) ---\n' +
    'innerWidth=' + innerWidth + ' documentElement.scrollWidth=' + de.scrollWidth + '\n' +
    'documentElement.scrollHeight=' + de.scrollHeight + ' clientHeight=' + de.clientHeight + '\n' +
    'body.scrollHeight=' + document.body.scrollHeight + '\n' +
    'sum of laid-out heights = 400 + sceneline + 1000 + 400\n' +
    'near plane getBoundingClientRect: ' + JSON.stringify(document.getElementById('near').getBoundingClientRect().toJSON()) + '\n' +
    'wide plane getBoundingClientRect: ' + JSON.stringify(document.getElementById('wide').getBoundingClientRect().toJSON());
</script>
