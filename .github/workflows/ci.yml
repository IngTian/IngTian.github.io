name: CI

# Build + typecheck + test gate. Runs on every PR and on pushes to main, so a branch must
# be green before it is merged (enable "Require status checks to pass" on the
# main branch protection rule to enforce it). Deploy lives in deploy.yml and
# runs only after a merge to main.
#
# workflow_dispatch lets the gate be run BY HAND, for when GitHub drops the push
# and pull_request events (it did, in the 2026-08-06 Actions incident):
#   gh workflow run ci.yml --ref <branch>
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # single source of truth for the Node version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # NOT type-checked: Astro and vitest hand .ts to esbuild, which strips annotations unchecked, so a
      # green build says nothing about types. The Typecheck step below does that.
      - name: Build
        run: npm run build

      # THE ONLY PLACE TYPES ARE CHECKED. Two checkers, because neither covers the other: `astro check`
      # is the only thing that reads the <script> bodies inside .astro files (tsc cannot parse .astro at
      # all), and plain `tsc --noEmit` is the only thing that covers tests/ and src/lib on their own
      # terms. `npm run typecheck` runs both.
      #
      # Placed after Build and before Test on purpose. After Build, so the generated content-collection
      # types in .astro/ exist on a fresh checkout; before Test, because a type error is cheaper to read
      # than the assertion failure it causes three steps later.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
