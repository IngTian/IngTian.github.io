name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let in-progress runs finish; queue (don't cancel) so a deploy isn't interrupted.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate the deploy on the SAME test suite CI runs. deploy.yml triggers on push
  # to main independently of ci.yml, so without this a red `npm test` could still
  # ship. build (and therefore deploy) waits on this passing.
  #
  # TESTS ONLY, NOT `npm run typecheck` — and that asymmetry with ci.yml is deliberate. A type error
  # cannot change the shipped bytes: Astro strips types with esbuild, so the HTML/CSS/JS built from a
  # type-error-ridden tree is byte-identical to the same tree with the annotation fixed. Blocking a
  # deploy on it would leave the LIVE SITE STALE to punish a mistake that is not in the output, which
  # is the worse failure. Types are the merge gate's job (ci.yml, required check on main); tests gate
  # the deploy because a red assertion means the logic behind the pixels is actually wrong.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc # single source of truth (matches ci.yml)
          cache: npm
      - run: npm ci
      # THE BUILD IS PART OF THE TEST GATE NOW, and without it this job cannot pass.
      #
      # tests/distSmoke.test.ts reads dist/**/*.html — it is the only coverage the suite has of RENDERED
      # output, and it deliberately THROWS when dist/ is missing rather than skipping, because a test that
      # quietly passes when its subject is absent is worse than no test. dist/ is gitignored, so a fresh
      # checkout has none: this job ran `npm ci && npm test` and would have failed 8 assertions on push to
      # main, and since `build` needs `test` and `deploy` needs `build`, EVERY DEPLOY WOULD HAVE STOPPED —
      # while ci.yml stayed green, because ci.yml happens to build before it tests.
      # Caught by a cleanup sweep before this branch merged, not by CI, precisely because CI cannot see it.
      - name: Build (dist/ is what distSmoke reads)
        run: npm run build
      - name: Test
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          # Astro 6 requires Node >=22.12 (astro's own `engines`, mirrored in package.json); the action
          # defaults to 20, which it rejects. HARDCODED ON PURPOSE, AND THE ONE PLACE THAT IS:
          # withastro/action takes only `node-version` — it has no `node-version-file` input, and it
          # does its own checkout, so .nvmrc is not readable before it runs. Everywhere else
          # (ci.yml, the test job above) reads .nvmrc directly. EDIT THIS LINE AND .nvmrc TOGETHER;
          # they both say 24 today, and a bump that changes only one of them would build the site on a
          # different Node than every check that approved it.
          node-version: 24
        # Installs deps, runs `astro build`, and uploads the Pages artifact.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
